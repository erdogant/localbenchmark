name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      # Never download models or datasets during CI
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests (network blocked, no LM Studio, no model)
        run: pytest localbenchmark/tests -v
